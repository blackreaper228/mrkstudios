      description: 'For example: events.html or session.html?category=events&work=2. Both the photo and its title
        use this link.'
  - name: slide4
    label: Photo 4
    type: object
    required: true
    fields:
    - name: title
      label: Title
      type: string
      required: true
      options:
        minlength: 1
        maxlength: 80
