      type: string
      required: true
      options:
        minlength: 1
        maxlength: 80
    - name: image
      label: Photo
      type: image
      required: true
      description: 'Upload JPG, PNG, WebP or AVIF. Recommended size: 1600 × 900 pixels.'
    - name: link
      label: Gallery link
      type: string
      description: 'For example: events.html or session.html?category=events&work=2. Both the photo and its title
        use this link.'
  - name: slide4
    label: Photo 4
    type: object
    required: true
    fields:
    - name: title
      label: Title
      type: string
      required: true
      options:
        minlength: 1
        maxlength: 80
    - name: image
      label: Photo
      type: image
      required: true
      description: 'Upload JPG, PNG, WebP or AVIF. Recommended size: 1600 × 900 pixels.'
    - name: link
      label: Gallery link
      type: string
      description: 'For example: events.html or session.html?category=events&work=2. Both the photo and its title
