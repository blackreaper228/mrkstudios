media:
  input: docs/uploads
  output: /mrkstudios/uploads
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - avif
  rename: safe
content:
- name: navigation
  label: Navigation and page names
  type: file
  path: docs/content/menu.json
  fields:
  - name: items
    label: Menu items
    type: object
    list: true
    fields:
    - name: page
      label: Page
      type: select
      required: true
      options:
        values:
        - events
        - concerts
        - commercials
        - documentaries
        - food
        - gear-rental
        - team
    - name: label
      label: Menu and page title
      type: string
      required: true
    - name: secondary
      label: Secondary menu group
      type: boolean
      default: false
- name: portfolio
  label: Homepage — photos, titles and links
  type: file
  path: docs/content/portfolio.json
  fields:
  - name: slide1
    label: Photo 1
    type: object
    required: true
    fields:
    - name: title
      label: Title
      type: string
      required: true
      options:
        minlength: 1
        maxlength: 80
    - name: image
      label: Photo
      type: image
      required: true
      description: 'Upload JPG, PNG, WebP or AVIF. Recommended size: 1600 × 900 pixels.'
    - name: link
      label: Gallery link
      type: string
      description: 'For example: events.html or session.html?category=events&work=2. Both the photo and its title
        use this link.'
  - name: slide2
    label: Photo 2
    type: object
    required: true
    fields:
