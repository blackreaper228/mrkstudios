- name: events
  label: Events
  type: file
  path: docs/content/galleries/events.json
  fields:
  - name: items
    label: Photoshoots
    type: object
    list: true
    fields:
    - name: title
      label: Photoshoot title
      type: string
      required: true
    - name: type
      label: Cover type
      type: select
      required: true
      default: image
      options:
        multiple: false
        values:
        - name: image
          label: Photo
        - name: video
          label: Video
    - name: image
      label: Upload photo
      type: image
      description: Used only when Photo is selected. Upload a photo or use Photo URL below.
    - name: imageUrl
      label: Photo URL
      type: string
      description: Used only when Photo is selected. A direct image URL takes priority over the uploaded photo.
    - name: video
      label: Video URL
      type: string
      description: Used only when Video is selected. Paste a Vimeo URL, including its privacy token for unlisted
        videos.
    - name: slug
      label: Photoshoot URL ID
      type: string
      description: Optional unique URL ID within this category, e.g. summer-2026. Used as work=summer-2026 in the
        photoshoot link. Leave empty to use the item number. Keep unchanged after sharing the link.
    - name: description
      label: Photoshoot description
      type: text
    - name: session
      label: Photoshoot media — add, remove and reorder
      type: object
      list: true
      fields:
      - name: title
        label: Caption / description
        type: string
      - name: type
        label: Media type
        type: select
        required: true
        default: image
        options:
          multiple: false
          values:
          - name: image
            label: Photo
          - name: video
            label: Video
      - name: image
        label: Upload photo
        type: image
        description: Used only when Photo is selected. Upload a photo or use Photo URL below.
      - name: imageUrl
        label: Photo URL
        type: string
        description: Used only when Photo is selected. A direct image URL takes priority over the uploaded photo.
      - name: video
        label: Video URL
        type: string
        description: Used only when Video is selected. Paste a Vimeo URL, including its privacy token for unlisted
          videos.
