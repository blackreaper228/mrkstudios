<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>mrk — selected films</title><meta name="description" content="mrk studios. Selected films, motion and visual stories."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='white'/%3E%3Ctext x='7' y='24' font-size='27' font-family='serif'%3Em%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main>
<section class="hero" id="hero" aria-label="Interactive television"><div class="scene"><canvas id="tv" tabindex="0" role="button" aria-label="Enter selected films"></canvas><div id="fallback" hidden><img src="assets/click-to-play.png" alt="CLICK TO PLAY"><button id="fallback-open" aria-label="Enter selected films"></button></div></div></section>
<section class="gallery" id="gallery" aria-label="Selected films" hidden>
<header class="navigation"><div class="local-clock"><span id="location">local</span><time id="local-time"></time></div><a href="#" class="logo" aria-label="mrk — back to television">mrk</a><nav aria-label="Main navigation"><a href="mailto:" id="contact">contact</a><span>menu</span></nav></header>
<div class="carousel" id="carousel" aria-roledescription="carousel" aria-label="Five selected films"><button class="side-zone previous" id="previous" aria-label="Previous film"><span aria-hidden="true">←</span></button><div class="film-stage" id="film-stage"><div class="film-tilt" id="film-tilt"><div class="film-track" id="film-track"></div></div></div><button class="side-zone next" id="next" aria-label="Next film"><span aria-hidden="true">→</span></button></div>
<div class="titles" aria-live="polite" aria-atomic="true"><h1 id="gallery-title" tabindex="-1"></h1></div>
<div class="custom-cursor" id="custom-cursor" aria-hidden="true"><div class="cursor-diamond"></div><span class="cursor-label">Play</span></div></section></main>
<dialog id="player"><button class="close-player" aria-label="Close video">close ×</button><video id="full-video" controls playsinline></video></dialog><script type="module" src="app.js"></script><script type="module" src="carousel.js"></script></body></html>
