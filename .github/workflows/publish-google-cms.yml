name: Publish Google CMS content

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: google-cms-publication
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - uses: actions/cache/restore@v4
        with:
          path: .google-image-cache
          key: google-images-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: google-images-
      - name: Validate CMS integration
        run: |
          python -m unittest discover -s scripts -p 'test_google*.py'
          node scripts/test-content.mjs
      - name: Import published Google content
        timeout-minutes: 8
        run: python -u scripts/sync-google-content.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .google-image-cache
          key: google-images-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Synchronize the published site
        run: python scripts/sync-site.py
      - name: Commit refreshed static content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content docs/uploads/google docs/*.html dist/content dist/uploads/google dist/*.html google-cms/image-manifest.json google-cms/generated-pages.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh site from Google CMS"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
