name: Create CMS page editors
on:
  push:
    branches: [main]
    paths:
      - docs/content/menu.json
      - scripts/sync-cms-pages.py
      - .github/workflows/sync-cms-pages.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: cms-page-editors
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install PyYAML==6.0.2
      - name: Create editors and preserve gallery content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync-cms-pages.py
            git add .pages.yml docs/content
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update CMS page editors from menu"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
